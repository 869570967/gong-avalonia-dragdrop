name: ci

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - develop

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build and package Avalonia
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup .NET 6 for XAML Styler
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: List dotnet sdks
        run: dotnet --info

      - name: Build and package Avalonia
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: cake-build/cake-action@v2
        with:
          cake-version: tool-manifest
          verbosity: Normal
          script-path: build.cake
          target: package

      - name: Build and package Avalonia release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: cake-build/cake-action@v2
        with:
          cake-version: tool-manifest
          verbosity: Normal
          script-path: build.cake
          target: package

      - name: Upload Avalonia packages
        uses: actions/upload-artifact@v4
        with:
          name: gong-avalonia-dragdrop-${{ github.sha }}
          path: Publish/*
          if-no-files-found: error

      - name: Log in to NuGet with OIDC
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: lijiaolong

      - name: Publish Avalonia package to NuGet
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem 'Publish/gong-avalonia-dragdrop.*.nupkg' -File)
          if ($packages.Count -ne 1) {
            throw "Expected exactly one Avalonia package, but found $($packages.Count)."
          }

          $packages | ForEach-Object {
            dotnet nuget push $_.FullName `
              --api-key '${{ steps.nuget-login.outputs.NUGET_API_KEY }}' `
              --source 'https://api.nuget.org/v3/index.json' `
              --skip-duplicate
          }
