name: ci

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  build:
    name: Build and package Avalonia
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: List dotnet sdks
        run: dotnet --info

      - name: Build and package Avalonia
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: cake-build/cake-action@v2
        with:
          cake-version: tool-manifest
          verbosity: Normal
          script-path: build.cake
          target: package

      - name: Build, sign, and package Avalonia release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: cake-build/cake-action@v2
        with:
          cake-version: tool-manifest
          verbosity: Normal
          script-path: build.cake
          target: ci
        env:
          azure-key-vault-url: ${{ secrets.AZURE_KEY_VAULT_URL }}
          azure-key-vault-client-id: ${{ secrets.AZURE_KEY_VAULT_CLIENT_ID }}
          azure-key-vault-tenant-id: ${{ secrets.AZURE_KEY_VAULT_TENANT_ID }}
          azure-key-vault-client-secret: ${{ secrets.AZURE_KEY_VAULT_CLIENT_SECRET }}
          azure-key-vault-certificate: ${{ secrets.AZURE_KEY_VAULT_CERTIFICATE }}

      - name: Upload Avalonia packages
        uses: actions/upload-artifact@v4
        with:
          name: gong-avalonia-dragdrop-${{ github.sha }}
          path: Publish/*
          if-no-files-found: error

      - name: Publish Avalonia package to NuGet
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw 'The NUGET_API_KEY secret is not configured.'
          }

          $packages = @(Get-ChildItem 'Publish/gong-avalonia-dragdrop.*.nupkg' -File)
          if ($packages.Count -ne 1) {
            throw "Expected exactly one Avalonia package, but found $($packages.Count)."
          }

          $packages | ForEach-Object {
            dotnet nuget push $_.FullName `
              --api-key $env:NUGET_API_KEY `
              --source 'https://api.nuget.org/v3/index.json' `
              --skip-duplicate
          }
